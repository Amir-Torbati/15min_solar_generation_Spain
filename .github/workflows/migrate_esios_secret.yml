name: Transfer encrypted ESIOS secret
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt:
    if: github.actor == 'Amir-Torbati' && github.repository == 'Amir-Torbati/15min_solar_generation_Spain'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyNaCl==1.6.2
      - name: Seal secret for the destination repository
        env:
          ESIOS_API_TOKEN: ${{ secrets.ESIOS_API_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib
          from nacl.public import PublicKey, SealedBox
          token = os.environ.pop('ESIOS_API_TOKEN', '')
          if not token:
              raise SystemExit('Source secret is unavailable')
          public_key = PublicKey(base64.b64decode('IN6iIAtDAXhdal+zYA2E67PS7nb+ZYcIlgTis56+S3Q='))
          encrypted = base64.b64encode(SealedBox(public_key).encrypt(token.encode())).decode()
          pathlib.Path('encrypted.json').write_text(json.dumps({
              'repository': 'Amir-Torbati/ree-data-platform',
              'key_id': '3380204578043523366', 'encrypted_value': encrypted
          }))
          del token
          print('Created sealed payload for the destination repository; no plaintext exported.')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sealed-esios-for-ree-data-platform
          path: encrypted.json
          retention-days: 1
          if-no-files-found: error
